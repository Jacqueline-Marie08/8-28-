<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Planner</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f3eb;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100vh;
  background:#a8c3a0;
  padding:20px;
  box-sizing:border-box;
}

.sidebar h2{
  color:white;
}

.sidebar a{
  display:block;
  background:white;
  color:#2f3e34;
  text-decoration:none;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

.main{
  margin-left:240px;
  padding:30px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>📚 Planner</h2>

  <a href="#dashboard">Dashboard</a>
  <a href="#assignments">Assignments</a>
  <a href="#classes">Classes</a>
  <a href="#tests">Tests</a>
  <a href="#notes">Notes</a>
  <a href="#habits">Habits</a>
</div>

<div class="main">

  <div id="dashboard" class="card">
    <h1>Dashboard</h1>
    <p>Welcome to your planner.</p>
  </div>

 <div id="assignments" class="card">
  <h2>Assignments</h2>

  <input id="assignmentName" placeholder="Assignment Name">

  <input id="assignmentDate" type="date">

  <select id="assignmentPriority">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
  </select>

  <button onclick="addAssignment()">
    Add Assignment
  </button>

  <div id="assignmentList"></div>

</div>

  <div id="classes" class="card">
    <h2>Classes</h2>

    <ul>
      <li>Business Law</li>
      <li>HR Marketing</li>
      <li>Marketing</li>
      <li>Excel</li>
    </ul>
  </div>

  <div id="tests" class="card">
  <h2>Tests</h2>

  <input id="testName" placeholder="Test Name">

  <input id="testDate" type="date">

  <button onclick="addTest()">
    Add Test
  </button>

  <div id="testList"></div>

</div>

  <div id="notes" class="card">
    <h2>Notes</h2>
  </div>

  <div id="habits" class="card">
    <h2>Habits</h2>
  </div>

</div>
<script>
function loadTests() {

  const tests =
    JSON.parse(localStorage.getItem("tests")) || [];

  const list =
    document.getElementById("testList");

  if (!list) return;

  list.innerHTML = "";

  tests.forEach((test, index) => {

    list.innerHTML += `
      <div class="card">
        <strong>${test.name}</strong><br>
        Test Date: ${test.date}<br>

        <button onclick="deleteTest(${index})">
          Delete
        </button>
      </div>
    `;

  });

}

function addTest() {

  const name =
    document.getElementById("testName").value;

  const date =
    document.getElementById("testDate").value;

  if (!name) return;

  const tests =
    JSON.parse(localStorage.getItem("tests")) || [];

  tests.push({
    name: name,
    date: date
  });

  localStorage.setItem(
    "tests",
    JSON.stringify(tests)
  );

  document.getElementById("testName").value = "";
  document.getElementById("testDate").value = "";

  loadTests();

}

function deleteTest(index) {

  const tests =
    JSON.parse(localStorage.getItem("tests")) || [];

  tests.splice(index, 1);

  localStorage.setItem(
    "tests",
    JSON.stringify(tests)
  );

  loadTests();

}
function loadAssignments() {

  const assignments =
    JSON.parse(
      localStorage.getItem("assignments")
    ) || [];

  const list =
    document.getElementById("assignmentList");

  list.innerHTML = "";

  assignments.forEach((item, index) => {

    list.innerHTML += `
      <div class="card">
        <strong>${item.name}</strong><br>
        Due: ${item.date}<br>
        Priority: ${item.priority}<br>

        <button onclick="deleteAssignment(${index})">
          Delete
        </button>
      </div>
    `;

  });

}

function addAssignment() {

  const name =
    document.getElementById("assignmentName").value;

  const date =
    document.getElementById("assignmentDate").value;

  const priority =
    document.getElementById("assignmentPriority").value;

  if (!name) return;

  const assignments =
    JSON.parse(
      localStorage.getItem("assignments")
    ) || [];

  assignments.push({
    name,
    date,
    priority
  });

  localStorage.setItem(
    "assignments",
    JSON.stringify(assignments)
  );

  document.getElementById("assignmentName").value = "";
  document.getElementById("assignmentDate").value = "";

  loadAssignments();

}

function deleteAssignment(index) {

  const assignments =
    JSON.parse(
      localStorage.getItem("assignments")
    ) || [];

  assignments.splice(index, 1);

  localStorage.setItem(
    "assignments",
    JSON.stringify(assignments)
  );

  loadAssignments();

}

window.onload = function() {
  loadAssignments();
  loadTests();
};

</script>
</body>
</html>
